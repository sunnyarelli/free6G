# free6G UE (5G SA) over ZeroMQ to the 6g-ran gNB. Credentials = 6g-core test subscriber.

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = none

[log]
all_level = warning
filename = /tmp/free6g_ue.log

[usim]
mode = soft
algo = milenage
opc  = 8e27b6af0e692e750f32667a3b14605d
k    = 8baf473f2f8fd09487cccbd7097c6862
imsi = 208930000000001
imei = 356938035643803

[rrc]
release = 15
ue_category = 4

[nas]
apn = internet
apn_protocol = ipv4

[slicing]
enable = true
nssai-sst = 1
nssai-sd = 66051

[gw]
netns = ue1
ip_devname = tun_ue
ip_netmask = 255.255.255.0

[gui]
enable = false
